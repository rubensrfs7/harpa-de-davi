<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escalas do Harpa de Davi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- HTML2PDF Library for Client-side PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }

      /* Utilitário para esconder scrollbar mas manter funcionalidade */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      /* ESTILOS EXCLUSIVOS PARA O PDF - PRESERVA O FORMATO DE CARD */
      .pdf-export-mode {
        background-color: #0b0f1a !important; /* Fundo escuro externo */
        padding: 20px !important;
        width: 800px !important; /* Largura ideal para caber no A4 sem cortes */
        margin: 0 auto !important;
      }

      /* Estilo forçado do Card no PDF */
      .pdf-export-mode .group {
        background-color: #161c2d !important; /* Azul escuro profundo (conforme imagem) */
        border: 1px solid #1e293b !important;
        border-radius: 24px !important;
        margin-bottom: 20px !important;
        box-shadow: none !important;
        display: flex !important;
        flex-direction: row !important;
        overflow: hidden !important;
      }

      /* Coluna da esquerda (Data) no PDF */
      .pdf-export-mode .md\:w-32 {
        background-color: #242d3d !important; /* Um pouco mais claro que o card */
        border-right: 1px solid #1e293b !important;
        width: 120px !important;
        min-width: 120px !important;
      }

      /* Cada item de músico/cantor no PDF */
      .pdf-export-mode .group\/item {
        background-color: #242d3d !important; /* Fundo dos cards internos */
        border: 1px solid #2d3748 !important;
        border-radius: 16px !important;
      }

      /* Textos no PDF */
      .pdf-export-mode .text-slate-800,
      .pdf-export-mode .dark\:text-slate-100,
      .pdf-export-mode .text-slate-700,
      .pdf-export-mode .font-bold,
      .pdf-export-mode h3, .pdf-export-mode h4 {
        color: #ffffff !important;
      }

      .pdf-export-mode .text-slate-500,
      .pdf-export-mode .text-slate-400 {
        color: #a0aec0 !important;
      }

      /* Cores de destaque no PDF */
      .pdf-export-mode .text-amber-600, 
      .pdf-export-mode .text-amber-400,
      .pdf-export-mode .italic {
        color: #f6ad55 !important; /* Laranja suave */
      }

      .pdf-export-mode .bg-indigo-100 { background-color: #2c3e50 !important; color: #a3bffa !important; }
      .pdf-export-mode .bg-purple-100 { background-color: #3b2a50 !important; color: #d6bcfa !important; }
      .pdf-export-mode .bg-pink-100 { background-color: #502a3b !important; color: #fbb6ce !important; }

      /* Ajuste de fotos no PDF */
      .pdf-export-mode img {
        border: 2px solid #ffffff !important;
        display: block !important;
        visibility: visible !important;
      }

      .pdf-export-mode .no-print {
        display: none !important;
      }

      /* Prevenir quebras de página no meio de um card */
      .page-break {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      @media print {
        .no-print {
          display: none !important;
        }
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #475569;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
  </body>
</html>
